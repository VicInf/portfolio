<section id="about">
  <div class="section-header">
    <h2 class="section-title">{{ i18n.t('aboutTitle') }}</h2>
  </div>
  <div class="about-grid">
    <div class="about-panel">
      <h3 class="panel-title">{{ i18n.t('skillsTitle') }}</h3>
      <div class="skill-list">
        @for (skill of skills; track skill) {
          <span class="skill-tag">{{ i18n.txSkill(skill) }}</span>
        }
      </div>
    </div>
    <div class="about-panel">
      <h3 class="panel-title">{{ i18n.t('profileTitle') }}</h3>
      <p class="panel-text">
        {{ i18n.t('profileLead') }}
        <br /><br />
        {{ i18n.t('profileLang') }}
      </p>
    </div>
  </div>
</section>
