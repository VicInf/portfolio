<section id="hero" class="hero">
  <div class="hero-content">
    <span class="eyebrow">{{ i18n.t('eyebrow') }}</span>
    <h1>{{ i18n.t('h1a') }}<br />{{ i18n.t('h1b') }}</h1>
    <p class="hero-subtitle">{{ i18n.t('subtitle') }}</p>
    <div class="hero-stats">
      @for (stat of stats; track stat.key) {
        <div class="stat">
          <span class="stat-label">{{ i18n.t(stat.key) }}</span>
          <span class="stat-value">{{ i18n.t(stat.valueKey) }}</span>
        </div>
      }
    </div>
    <div class="hero-actions">
      <a [href]="i18n.cvHref()" download="Vicente-Perez-CV.pdf" class="menu-btn"><span>{{ i18n.t('ctaCv') }}</span></a>
      <a href="#work" class="menu-btn secondary"><span>{{ i18n.t('ctaPrimary') }}</span></a>
    </div>
  </div>
</section>
